name = "gidfine-api"
main = "workers/api/src/index.ts"
compatibility_date = "2024-11-01"

# ============================================
# Database Binding (D1)
# ============================================
[[d1_databases]]
binding = "DB"
database_name = "gidfine-db"
database_id = "fe4a9ac1-436a-42b3-b76b-ef79f7787420"

# ============================================
# Object Storage Binding (R2)
# ============================================
[[r2_buckets]]
binding = "R2"
bucket_name = "gidfine-documents"

# ============================================
# Cache Binding (KV)
# ============================================
[[kv_namespaces]]
binding = "CACHE"
id = "5886b255cb484f4ca24b5a566aafc80d"

# ============================================
# Queue Binding
# ============================================
[[queues.consumers]]
queue = "gidfine-notifications"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "gidfine-notifications-dlq"

# ============================================
# Durable Objects
# ============================================
[[durable_objects.bindings]]
name = "CHAT_SESSION"
class_name = "ChatSession"
script_name = "gidfine-api"

# ============================================
# Environment Variables
# ============================================
[env.development]
  name = "gidfine-api-dev"
  vars = { ENVIRONMENT = "development" }

[env.staging]
  name = "gidfine-api-staging"
  vars = { ENVIRONMENT = "staging" }

[env.production]
  name = "gidfine-api"
  vars = { ENVIRONMENT = "production" }

# Custom domain routes can be added after the domain is owned and configured.
# Until then, Wrangler exposes these Workers through their workers.dev hostnames.

# ============================================
# Secrets (Use `wrangler secret put` to set)
# ============================================
# JWT_SECRET
# SENDGRID_API_KEY (optional)
# TWILIO_API_KEY (optional)

# ============================================
# Triggers (Cron Jobs)
# ============================================
[[triggers.crons]]
crons = ["0 0 * * *"]  # Daily at midnight

[[triggers.crons]]
crons = ["0 */6 * * *"]  # Every 6 hours (overdue reminders)

# ============================================
# Limits
# ============================================
[limits]
  cpu_milliseconds = 50000  # 50s max execution time
