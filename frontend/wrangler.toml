name = "loan-engine"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-27"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_NAME = "Gidfine"
APP_ENV = "development"
ALLOWED_ORIGINS = "http://localhost:5173,https://loan-engine.pages.dev"
ACCESS_TOKEN_TTL_SECONDS = "900"

[env.production.vars]
APP_NAME = "Gidfine"
APP_ENV = "production"
ALLOWED_ORIGINS = "https://loan-engine.pages.dev"
ACCESS_TOKEN_TTL_SECONDS = "900"

[[env.production.d1_databases]]
binding = "DB"
database_name = "gidfine-db"
database_id = "a0962b01-8cd5-407a-9d74-3d5f8c3e3e85"
migrations_dir = "../workers/api/migrations"

[[env.production.r2_buckets]]
binding = "R2"
bucket_name = "gidfine-documents"

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "5886b255cb484f4ca24b5a566aafc80d"

[[d1_databases]]
binding = "DB"
database_name = "gidfine-db"
database_id = "a0962b01-8cd5-407a-9d74-3d5f8c3e3e85"
migrations_dir = "../workers/api/migrations"

[[r2_buckets]]
binding = "R2"
bucket_name = "gidfine-documents"

[[kv_namespaces]]
binding = "CACHE"
id = "5886b255cb484f4ca24b5a566aafc80d"

# JWT_SIGNING_KEY, ADMIN_EMAIL, and ADMIN_PASSWORD belong in Pages secrets
# or frontend/.dev.vars for local Pages Functions development.
